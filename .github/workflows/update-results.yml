name: Aktualizace výsledků U11
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4
      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nainstalovat Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Načíst výsledky z Fotbal.cz
        run: python scripts/update_results.py
      - name: Uložit změny do repozitáře
        run: |
          if git diff --quiet -- index.html; then
            echo "Data se nezměnila."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automatická aktualizace výsledků U11"
          git push
